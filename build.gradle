buildscript {
    repositories {
        maven { url = uri("https://maven.fabricmc.net/") }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.17.19"
    }
}

plugins {
    id "maven-publish"
}

def versions = [
    "1.21.10": [
        loader:    "0.19.3",
        fabricApi: "0.138.4+1.21.10",
        java:      21
    ],
    "26.1.2": [
        loader:        "0.19.3",
        fabricApi:     "0.155.2+26.1.2",
        java:          25,
        nonObfuscated: true
    ],
    "26.2": [
        loader:        "0.19.3",
        fabricApi:     "0.157.0+26.2",
        java:          25,
        nonObfuscated: true
    ]
]

def targetMc = findProperty("mc") ?: gradle.ext.defaultMc
if (!versions.containsKey(targetMc)) {
    throw new GradleException(
        "Unsupported MC version '${targetMc}'. Valid options: ${versions.keySet().sort().join(', ')}"
    )
}

def v = versions[targetMc]
def isNonObfuscated = v.nonObfuscated ?: false
apply plugin: isNonObfuscated ? "net.fabricmc.fabric-loom" : "net.fabricmc.fabric-loom-remap"

group = "com.mtxcore"
version = "${mod_version}+mc${targetMc}"

base {
    archivesName = "hide-minimega-leaderboards"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

def modConfig = isNonObfuscated ? "implementation" : "modImplementation"

dependencies {
    minecraft "com.mojang:minecraft:${targetMc}"
    if (!isNonObfuscated) {
        mappings loom.officialMojangMappings()
    }

    "${modConfig}" "net.fabricmc:fabric-loader:${v.loader}"
    "${modConfig}" "net.fabricmc.fabric-api:fabric-api:${v.fabricApi}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", targetMc
    inputs.property "loader_version", v.loader

    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version: targetMc,
            loader_version: v.loader
        )
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(v.java)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = v.java
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds every supported Re-Console version."

    def execOps = services.get(org.gradle.process.ExecOperations)

    doLast {
        def failures = []
        def isWindows = System.properties["os.name"].toLowerCase().contains("win")
        def gradleCmd = isWindows ? "gradlew.bat" : "./gradlew"

        versions.keySet().sort().each { mc ->
            println "\n========== Building for MC ${mc} =========="
            def javaHome = findProperty("java${versions[mc].java}Home")
                ?: System.getenv("JAVA${versions[mc].java}_HOME")
            def command = [gradleCmd, "build", "-Pmc=${mc}", "--console=plain"]
            if (javaHome) {
                command += "-Dorg.gradle.java.home=${javaHome}"
            }
            def result = execOps.exec {
                commandLine command
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                failures << mc
            }
        }

        if (failures) {
            throw new GradleException("buildAll failed for: ${failures.join(', ')}")
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
}
